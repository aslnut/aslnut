<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aslnut · journey</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; color: #dde3ea; font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; max-width: min(360px, calc(100vw - 16px)); background: rgba(8, 12, 20, .74); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 6px 9px; backdrop-filter: blur(6px); font-size: 12px; z-index: 3; }
  #panel b { color: #fff; }
  #panel .shots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #panel a { color: #dde3ea; background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 6px; text-decoration: none; font-size: 11.5px; }
  #panel a.on { background: #2f81f7; color: #fff; }
  #panel .why { color: #9aa7b4; font-size: 11px; }
  #panel .err { color: #ff7b72; white-space: pre-wrap; font-size: 11px; max-height: 90px; overflow: auto; }
  .webgpu { color: #7ee787; } .webgl2 { color: #79c0ff; }
  #caption { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(46px + env(safe-area-inset-bottom)); max-width: calc(100vw - 32px); text-align: center; pointer-events: none; z-index: 2; }
  #caption .where { font-size: 15px; font-weight: 600; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.65); }
  #caption .when { font-size: 12px; color: #e8edf3; text-shadow: 0 1px 5px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
  #caption .jump { display: inline-block; margin-top: 4px; font-size: 11.5px; color: #111; background: rgba(255, 214, 102, .92); padding: 1px 8px; border-radius: 8px; opacity: 0; }
  /* the credits: one line, a tap shows them all; the reel's wrap (every credit read whole in a recording) */
  .credits { font: 10px/1.3 system-ui, sans-serif; color: rgba(255,255,255,.85); text-shadow: 0 0 3px #000; max-width: 72%; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; cursor: pointer; }
  .credits.open, body.reel .credits { white-space: normal; max-width: calc(100% - 12px); }
  .credits.open { background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 6px; }
  /* the reel: the picture alone (a recorder captures it), its credits kept */
  body.reel #panel { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel"><div>loading…</div></div>
<div id="caption"><div class="where"></div><div class="when"></div><div class="jump"></div></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
