<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aslnut · hello earth</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; color: #dde3ea; font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; max-width: min(340px, calc(100vw - 16px)); background: rgba(8, 12, 20, .78); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; backdrop-filter: blur(6px); }
  #panel b { color: #fff; } #panel .row { display: flex; justify-content: space-between; gap: 10px; }
  #panel .api { font-weight: 700; } .webgpu { color: #7ee787; } .webgl2 { color: #79c0ff; }
  #panel .why { color: #9aa7b4; font-size: 11px; }
  #panel .err { color: #ff7b72; white-space: pre-wrap; font-size: 11px; max-height: 120px; overflow: auto; }
  #presets { margin-top: 6px; }
  #presets[open] { display: flex; flex-wrap: wrap; gap: 4px; }
  #presets summary { width: 100%; cursor: pointer; color: #9aa7b4; font-size: 12px; }
  ul.gaps { margin: 4px 0; padding-left: 18px; font-size: 12px; color: #c9d1d9; }
  #presets a { color: #dde3ea; background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 6px; text-decoration: none; font-size: 12px; }
  #presets a.on { background: #2f81f7; color: #fff; }
  #editor { position: fixed; right: 8px; top: calc(8px + env(safe-area-inset-top)); width: min(360px, calc(100vw - 16px)); display: none; background: rgba(8,12,20,.85); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px; }
  #editor textarea { width: 100%; height: 120px; box-sizing: border-box; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; font: 12px ui-monospace, monospace; }
  #editor input[type=range] { width: 100%; }
  details summary { cursor: pointer; color: #9aa7b4; }
  #ui { position: fixed; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); width: min(320px, calc(100vw - 16px)); display: none; background: rgba(8,12,20,.86); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; z-index: 5; }
  #ui .head { display: flex; justify-content: space-between; padding: 6px 10px; cursor: pointer; font-weight: 600; }
  #ui .body { padding: 0 10px 8px; display: flex; flex-direction: column; gap: 6px; }
  #ui.closed .body { display: none; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #ui input[type=range] { flex: 1; }
  #ui button { background: rgba(255,255,255,.08); color: #dde3ea; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; }
  #ui button.on { background: #2f81f7; border-color: #2f81f7; color: #fff; }
  #ui .q { display: flex; flex-direction: column; gap: 4px; }
  #ui .q button { text-align: left; }
  #ui .why { color: #9aa7b4; font-size: 11px; min-height: 14px; }
  #auto { position: fixed; left: 50%; transform: translateX(-50%); top: calc(8px + env(safe-area-inset-top)); z-index: 6; display: none; gap: 8px; align-items: center; background: rgba(8,12,20,.86); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; padding: 6px 8px 6px 12px; font-size: 13px; }
  #auto button { background: #2f81f7; color: #fff; border: 0; border-radius: 14px; padding: 6px 12px; font: inherit; font-weight: 600; }
  #auto.playing { background: rgba(160, 40, 30, .9); } #auto.playing button { background: #fff; color: #a0281e; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel"><div>loading…</div></div>
<div id="auto"><span id="auto-text"></span><button id="auto-btn"></button></div>
<div id="editor">
  <div class="row"><b>your shader</b><span id="sh-state" class="why">WGSL subset → WebGPU and WebGL2</span></div>
  <textarea id="sh" spellcheck="false"></textarea>
  <label class="why">heat.gain <span id="gain-v"></span><input id="gain" type="range" min="0" max="3" step="0.05"></label>
</div>
<div id="ui"><div class="head"><span class="title"></span><span>▾</span></div><div class="body"></div></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
