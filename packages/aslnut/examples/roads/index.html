<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aslnut · roads</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1626; color: #e6ebf0; font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bar { position: fixed; left: 8px; top: calc(8px + env(safe-area-inset-top)); right: 8px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 5; }
  #bar a { color: #e6ebf0; background: rgba(10,14,22,.8); border: 1px solid rgba(255,255,255,.15); border-radius: 7px; padding: 4px 8px; text-decoration: none; }
  #bar a.on { background: #2f81f7; border-color: #2f81f7; }
  #stage-control { position:fixed;left:8px;right:8px;bottom:calc(52px + env(safe-area-inset-bottom));background:rgba(10,14,22,.88);border-radius:8px;padding:8px 12px;z-index:5;max-width:560px; }
  #stage-label { display:block;font-size:12px;min-height:18px; }
  #stage { width:100%;height:44px;margin:0;accent-color:#eead51;touch-action:pan-x; }
  #loading { position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(10,14,22,.88);border-radius:8px;padding:10px 16px;z-index:6;font-size:14px;pointer-events:none; }
  #loading::before { content:'';display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;border:2px solid #eead51;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #note { position: fixed; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: 70vw; background: rgba(10,14,22,.8); border-radius: 7px; padding: 6px 9px; z-index: 5; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="bar"></div>
<div id="note"></div>
<div id="loading">Loading…</div>
<label id="stage-control"><output id="stage-label" for="stage"></output><input id="stage" type="range" min="0" max="15" step="1" aria-label="Bake stage, zero is the old result"></label>
<script type="module" src="./main.ts"></script>
</body>
</html>
