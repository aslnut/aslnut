<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aslnut · recipes</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f16; color: #e6ebf0; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #recipes { position: fixed; left: 8px; top: calc(8px + env(safe-area-inset-top)); z-index: 10; display: flex; gap: 4px; flex-wrap: wrap; max-width: calc(100vw - 16px); }
  #recipes a { color: #cfe8ff; background: rgba(12,16,24,.82); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 4px 9px; text-decoration: none; font-size: 12px; }
  #recipes a.on { background: #2f81f7; border-color: #2f81f7; color: #fff; }
  #recipes .build { color: #93a1af; padding: 4px 6px; font-size: 11px; }
</style>
</head>
<body>
<div id="stage"><canvas id="view"></canvas></div>
<nav id="recipes"></nav>
<script type="module" src="./main.ts"></script>
</body>
</html>
