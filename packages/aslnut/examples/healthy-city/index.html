<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aslnut · healthy city</title>
<style>
  :root { --bg: rgba(10, 14, 22, .84); --line: rgba(255,255,255,.13); --fg: #e6ebf0; --dim: #9aa7b4; --accent: #34d399; --blue: #2f81f7; }
  html, body { margin: 0; height: 100%; background: #070a10; color: var(--fg); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: var(--fg); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  select { font: inherit; color: var(--fg); background: #111824; border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; max-width: 100%; }
  #top { position: fixed; left: 0; right: 0; top: 0; padding: calc(6px + env(safe-area-inset-top)) 8px 6px; display: flex; align-items: center; gap: 6px; background: linear-gradient(180deg, rgba(7,10,16,.86), rgba(7,10,16,.0)); z-index: 10; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; text-shadow: 0 1px 3px #000; }
  #crumbs a { color: var(--fg); text-decoration: none; padding: 3px 4px; border-radius: 6px; }
  #crumbs a.up { color: #b9c6d3; } #crumbs a.up:hover { background: rgba(255,255,255,.1); }
  #crumbs .sep { color: #6b7785; }
  #env { white-space: nowrap; }
  .icon { width: 34px; height: 32px; padding: 0; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; background: var(--bg); }
  #build { position: fixed; right: 6px; bottom: calc(3px + env(safe-area-inset-bottom)); font-size: 10px; color: rgba(255,255,255,.7); text-shadow: 0 0 3px #000; z-index: 5; text-align: right; max-width: 72vw; pointer-events: none; }
  .dialog { position: fixed; z-index: 30; left: 50%; top: calc(48px + env(safe-area-inset-top)); transform: translateX(-50%); width: min(760px, calc(100vw - 16px)); max-height: calc(100vh - 64px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display: none; flex-direction: column; background: rgba(12, 17, 26, .96); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5); overflow: hidden; }
  .dialog.open { display: flex; }
  .dialog header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
  .dialog .body { display: flex; min-height: 0; flex: 1; }
  .tabs { width: 190px; flex: none; border-right: 1px solid var(--line); padding: 6px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  .tabs button { text-align: left; border: 0; background: none; padding: 7px 9px; }
  .tabs button.on { background: rgba(47,129,247,.25); color: #fff; }
  .tabs button .note { display: block; font-size: 11px; color: var(--dim); font-weight: 400; }
  .pane { flex: 1; min-width: 0; padding: 10px 12px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .qs { display: flex; flex-wrap: wrap; gap: 5px; }
  .cfg { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .cfg label { color: var(--dim); }
  .desc { color: #c3ccd6; font-size: 12px; }
  .ranked { border-collapse: collapse; width: 100%; font-size: 12px; }
  .ranked td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,.05); }
  .ranked td.n { text-align: right; font-variant-numeric: tabular-nums; } .ranked td.r { color: var(--dim); width: 28px; }
  .ranked .bar { height: 6px; border-radius: 3px; background: var(--accent); opacity: .8; }
  .sources { font-size: 11px; color: var(--dim); } .sources a { color: #8cc4ff; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; position: sticky; bottom: 0; padding-top: 4px; }
  .actions .primary { background: var(--accent); border-color: var(--accent); color: #062014; font-weight: 700; }
  #legend-box { position: fixed; left: 8px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 6; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; min-width: 130px; max-width: 220px; display: none; }
  #legend-box .t { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
  #card { position: fixed; right: 8px; top: calc(48px + env(safe-area-inset-top)); width: min(300px, calc(100vw - 16px)); z-index: 8; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: none; }
  #access { position: fixed; left: 8px; top: calc(48px + env(safe-area-inset-top)); width: min(290px, calc(100vw - 16px)); z-index: 8; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: none; font-size: 12px; }
  #access.folded > :not(.t), #heat.folded > :not(.t), #flood.folded > :not(.t) { display: none; }
  #flood { position: fixed; left: 8px; top: calc(48px + env(safe-area-inset-top)); width: min(300px, calc(100vw - 16px)); z-index: 8; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: none; font-size: 12px; }
  #flood .t { cursor: pointer; font-weight: 700; color: #93c5fd; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; margin-bottom: 4px; } #flood table { width: 100%; } #flood td.v { text-align: right; font-variant-numeric: tabular-nums; } #flood .k { color: var(--dim); }
  #heat { position: fixed; left: 8px; top: calc(48px + env(safe-area-inset-top)); width: min(320px, calc(100vw - 16px)); max-height: calc(100vh - 120px); overflow: auto; z-index: 8; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: none; font-size: 12px; }
  @media (max-width: 520px) { #heat { max-height: 44vh; } }
  #heat .t { font-weight: 700; color: #fdba74; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; margin-bottom: 4px; cursor: pointer; } #heat table { width: 100%; } #heat td.v { text-align: right; font-variant-numeric: tabular-nums; } #heat .k { color: var(--dim); } #access .t { cursor: pointer; font-weight: 700; color: #6ee7b7; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; margin-bottom: 4px; } #access table { width: 100%; } #access td.v { text-align: right; font-variant-numeric: tabular-nums; } #access .k { color: var(--dim); }
  #card h3 { margin: 0 0 4px; font-size: 14px; } #card .k { color: var(--dim); } #card table { width: 100%; font-size: 12px; } #card td.v { text-align: right; }
  #card .src { font-size: 11px; color: var(--dim); margin-top: 6px; }
  #card .x { float: right; border: 0; background: none; padding: 0 2px; }
  #panel { position: fixed; left: 8px; top: calc(46px + env(safe-area-inset-top)); z-index: 7; width: min(300px, calc(100vw - 16px)); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 12px; display: none; }
  #panel .row { display: flex; justify-content: space-between; gap: 8px; } #panel .why { color: var(--dim); font-size: 11px; }
  #panel .webgpu { color: #7ee787; } #panel .webgl2 { color: #79c0ff; } #panel .err { color: #ff7b72; white-space: pre-wrap; max-height: 100px; overflow: auto; font-size: 11px; }
  #panel a { color: var(--fg); background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 6px; text-decoration: none; font-size: 12px; display: inline-block; margin: 2px 2px 0 0; }
  #panel a.on { background: var(--blue); }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(50px + env(safe-area-inset-top)); white-space: nowrap; z-index: 6; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 5px 12px; font-size: 12px; color: #c9d4de; pointer-events: none; transition: opacity .25s; }
  #modes { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 9; display: none; flex-direction: column; align-items: center; gap: 3px; }
  #modes .bar { display: flex; gap: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; align-items: center; }
  #modes .bar button { border: 0; } #person { font: inherit; font-size: 12px; max-width: 118px; background: transparent; color: inherit; border: 0; padding: 0 2px; } #person option { color: #111; } #kmh { font-size: 11px; color: var(--dim); padding: 0 6px; font-variant-numeric: tabular-nums; }
  #mode-help { font-size: 11px; color: #c9d4de; background: rgba(10,14,22,.7); border-radius: 6px; padding: 1px 7px; }
  @media (max-width: 640px) {
    .dialog .body { flex-direction: column; }
    .tabs { width: auto; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tabs button { white-space: nowrap; } .tabs button .note { display: none; }
    #env .long { display: none; }
    #crumbs .far { display: none; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="top">
  <button class="icon" id="b-panel" title="what the world is doing">≡</button>
  <div id="crumbs"></div>
  <button id="env" title="time and weather">☀ <span id="env-t">--:--</span><span class="long" id="env-w"></span></button>
  <button class="icon" id="b-stats" title="statistics"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="2" y="9" width="3" height="7" rx="1"/><rect x="7.5" y="4" width="3" height="12" rx="1"/><rect x="13" y="7" width="3" height="9" rx="1"/></svg></button>
  <button class="icon" id="b-layers" title="layers"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 2 16 6 9 10 2 6Z"/><path d="M2 9.5 9 13.5 16 9.5"/><path d="M2 12.8 9 16.6 16 12.8"/></svg></button>
</div>
<div id="panel"></div>
<div id="legend-box"><div class="t" id="legend-title"></div><div id="legend-slot"></div></div>
<div id="card"></div>
<div id="access"></div>
<div id="heat" class="side"></div>
<div id="flood" class="side"></div>
<div id="hint"></div>
<button id="walk" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));z-index:7;display:none;background:#34d399;border-color:#34d399;color:#062014;font-weight:700;padding:8px 14px;border-radius:18px">Street level ›</button>
<div class="dialog" id="d-stats"><header><span>Statistics</span><button id="x-stats">✕</button></header><div class="body"><div class="tabs" id="tabs"></div><div class="pane" id="pane"></div></div></div>
<div class="dialog" id="d-layers"><header><span>Layers</span><button id="x-layers">✕</button></header><div class="body"><div class="pane" id="layers-pane"></div></div></div>
<div class="dialog" id="d-env"><header><span>Time and weather</span><button id="x-env">✕</button></header><div class="body"><div class="pane" id="env-pane"></div></div></div>
<div id="modes"><div class="bar"><button data-mode="map" class="on">Map</button><button data-mode="walk">Walk</button><button data-mode="car">Car</button><button data-mode="drone">Drone</button><span id="kmh"></span></div><div id="mode-help"></div></div>
<div id="build"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
