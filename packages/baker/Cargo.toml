[package]
name = "aslnut-baker"
version = "0.1.6"
edition = "2021"
description = "Road baker: designs streets from map lines (curves, cross-sections, junction patterns, one planar partition, heights) and writes aslnut's baked roads pack"
license = "Apache-2.0"
repository = "https://github.com/aslnut/aslnut"
homepage = "https://github.com/aslnut/aslnut"
readme = "README.md"
keywords = ["gis", "roads", "procedural", "mesh", "aslnut"]
categories = ["science::geo", "graphics", "command-line-utilities"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "DESIGN.md"]

[lib]
# the code and the wasm build keep the short name (baker.wasm)
name = "baker"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "aslnut-baker"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
# the command line: every core (rayon), files
native = ["dep:rayon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
rayon = { version = "1", optional = true }
